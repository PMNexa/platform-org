[project]
name = "platform-org-backend"
version = "0.1.0"
description = "platform-org's Django app (multi-tenant orgs) - importable by a host app's INSTALLED_APPS, matching platform-auth's backend packaging pattern."
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "uuid6>=2024.1.12",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_org*", "core_api*"]
